services:

  # Sheepy Module

  sheepy.module:
    class: Sheepy
    factory: [ 'Module', 'getInstanceByName' ]
    arguments:
      - 'sheepy'

  sheepy.context:
    class: Context
    public: true
    factory: [ 'Context', 'getContext' ]

  # PS Account

  sheepy.ps_accounts_installer:
    class: 'PrestaShop\PsAccountsInstaller\Installer\Installer'
    public: true
    arguments:
      - "5.0"

  sheepy.ps_accounts_facade:
    class: 'PrestaShop\PsAccountsInstaller\Installer\Facade\PsAccounts'
    public: true
    arguments:
      - "@sheepy.ps_accounts_installer"

  # PS Billing

  sheepy.ps_billings_context_wrapper:
    class: 'PrestaShopCorp\Billing\Wrappers\BillingContextWrapper'
    arguments:
      - '@sheepy.ps_accounts_facade'
      - '@sheepy.context'
      - false

  sheepy.ps_billings_facade:
    class: 'PrestaShopCorp\Billing\Presenter\BillingPresenter'
    public: true
    arguments:
      - '@sheepy.ps_billings_context_wrapper'
      - '@sheepy.module'

  sheepy.ps_billings_service:
    class: 'PrestaShopCorp\Billing\Services\BillingService'
    public: true
    arguments:
      - '@sheepy.ps_billings_context_wrapper'
      - '@sheepy.module'